<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#ff4d6d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Head (solid fill) -->
  <circle cx="15.5" cy="3.5" r="2" fill="#ff4d6d" stroke="none"/>
  <!-- Torso (leaning forward) -->
  <line x1="15" y1="5.5" x2="13.5" y2="11"/>
  <!-- Forward arm (up-right) -->
  <line x1="14.5" y1="7.8" x2="18" y2="6.5"/>
  <!-- Back arm (down-left) -->
  <line x1="14.5" y1="7.8" x2="11.5" y2="9.5"/>
  <!-- Forward leg: thigh + shin -->
  <line x1="13.5" y1="11" x2="16.5" y2="16"/>
  <line x1="16.5" y1="16" x2="14.5" y2="21"/>
  <!-- Back leg: thigh + shin kicked up -->
  <line x1="13.5" y1="11" x2="10" y2="15.5"/>
  <line x1="10" y1="15.5" x2="12.5" y2="19"/>
</svg>
