<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#ff4d6d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Head (filled) -->
  <circle cx="16" cy="3.5" r="1.8" fill="#ff4d6d" stroke="none"/>
  <!-- Torso (leaning forward) -->
  <line x1="15.5" y1="5.3" x2="14" y2="10.5"/>
  <!-- Forward arm (up-right) -->
  <line x1="15" y1="8" x2="18.5" y2="7"/>
  <!-- Back arm (down-left) -->
  <line x1="15" y1="8" x2="11.5" y2="9.5"/>
  <!-- Front leg: thigh raised HIGH (near hip height), shin hanging down -->
  <line x1="14" y1="10.5" x2="17.5" y2="9.5"/>
  <line x1="17.5" y1="9.5" x2="17" y2="16"/>
  <!-- Back leg: push-off behind, shin trailing -->
  <line x1="14" y1="10.5" x2="10.5" y2="15"/>
  <line x1="10.5" y1="15" x2="12.5" y2="20"/>
</svg>
