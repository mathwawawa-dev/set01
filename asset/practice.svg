<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#1a1a2e" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round">
  <!-- Head -->
  <circle cx="14" cy="3.5" r="2"/>
  <!-- Torso (leaning forward) -->
  <line x1="14" y1="5.5" x2="13" y2="11.5"/>
  <!-- Forward arm -->
  <line x1="13.5" y1="8" x2="17.5" y2="7"/>
  <!-- Back arm -->
  <line x1="13.5" y1="8" x2="10" y2="10"/>
  <!-- Forward leg: thigh + shin -->
  <line x1="13" y1="11.5" x2="16" y2="17"/>
  <line x1="16" y1="17" x2="14" y2="21.5"/>
  <!-- Back leg: thigh + shin (kicked up behind) -->
  <line x1="13" y1="11.5" x2="9" y2="16.5"/>
  <line x1="9" y1="16.5" x2="12" y2="20"/>
</svg>
