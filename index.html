<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SET 게임</title>
  <meta name="description" content="27장의 커스텀 카드로 즐기는 웹 기반 SET 게임. 120초 안에 최대한 많은 SET를 찾아보세요!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 모드 선택 화면 (대문) -->
  <div class="mode-screen" id="modeScreen">
    <div class="mode-inner">
      <div class="mode-logo">
        <span id="logoS">S</span><span id="logoE">E</span><span id="logoT">T</span>
      </div>
      <p class="mode-subtitle">게임 모드를 선택하세요</p>
      <div class="mode-section-label">Junior SET <span class="mode-section-sub">· 27종 카드</span></div>
      <div class="mode-cards">
        <button class="mode-card" id="btnModeTutorial">
          <span class="mode-card-icon">
            <svg viewBox="0 0 24 24" width="2.4rem" height="2.4rem" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 22 8.5 12 15 2 8.5"/>
              <polyline points="6 11.5 6 18"/>
              <path d="M6 18c0 1.8 2.5 3 6 3s6-1.2 6-3"/>
              <line x1="22" y1="8.5" x2="22" y2="14"/>
            </svg>
          </span>
          <span class="mode-card-name">튜토리얼</span>
          <span class="mode-card-desc">SET가 처음이라면!<br>규칙을 익혀요</span>
          <span class="mode-card-tag">단계별 가이드</span>
        </button>
        <button class="mode-card" id="btnModeCountdown">
          <span class="mode-card-icon">
            <svg viewBox="0 0 24 24" width="2.4rem" height="2.4rem" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="13" r="8"/>
              <path d="M12 9v4l2 2"/>
              <path d="M10 3h4"/>
              <path d="M12 3v2"/>
            </svg>
          </span>
          <span class="mode-card-name">120초 챌린지</span>
          <span class="mode-card-desc">120초 안에 최대한 많은<br>SET를 찾아보세요</span>
          <span class="mode-card-tag">카운트다운</span>
        </button>
        <button class="mode-card" id="btnModeDeck">
          <span class="mode-card-icon">
            <svg viewBox="0 0 24 24" width="2.4rem" height="2.4rem" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8.5" cy="15.5" r="7.5"/>
              <circle cx="8.5" cy="15.5" r="4"/>
              <circle cx="8.5" cy="15.5" r="1.2"/>
              <line x1="8.5" y1="15.5" x2="20" y2="4"/>
              <path d="M16 8 L16 5 L20 1 L20 4 Z"/>
              <path d="M16 8 L19 8 L23 4 L20 4 Z"/>
            </svg>
          </span>
          <span class="mode-card-name">20 SET 도전</span>
          <span class="mode-card-desc">20개의 SET를 얼마나<br>빠르게 찾을 수 있나요?</span>
          <span class="mode-card-tag">카운트업</span>
        </button>
      </div>

      <div class="mode-section-label">정식 SET <span class="mode-section-sub">· 81종 카드</span></div>
      <div class="mode-cards">
        <button class="mode-card" id="btnModeOfficial">
          <span class="mode-card-icon icon-red">
            <svg viewBox="0 0 24 24" width="2.4rem" height="2.4rem" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="13" r="8"/>
              <path d="M12 9v4l2 2"/>
              <path d="M10 3h4"/>
              <path d="M12 3v2"/>
            </svg>
          </span>
          <span class="mode-card-name">120초 챌린지</span>
          <span class="mode-card-desc">120초 안에 최대한 많은<br>SET를 찾아보세요</span>
          <span class="mode-card-tag">카운트다운</span>
        </button>
        <button class="mode-card" id="btnModeOfficialDeck">
          <span class="mode-card-icon icon-red">
            <svg viewBox="0 0 24 24" width="2.4rem" height="2.4rem" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8.5" cy="15.5" r="7.5"/>
              <circle cx="8.5" cy="15.5" r="4"/>
              <circle cx="8.5" cy="15.5" r="1.2"/>
              <line x1="8.5" y1="15.5" x2="20" y2="4"/>
              <path d="M16 8 L16 5 L20 1 L20 4 Z"/>
              <path d="M16 8 L19 8 L23 4 L20 4 Z"/>
            </svg>
          </span>
          <span class="mode-card-name">20 SET 도전</span>
          <span class="mode-card-desc">20개의 SET를 얼마나<br>빠르게 찾을 수 있나요?</span>
          <span class="mode-card-tag">카운트업</span>
        </button>
      </div>
      <div class="mode-version">v2.22_20260806_0618_btn_outside_aligned</div>
    </div>
  </div>

  <!-- 튜토리얼 화면 -->
  <div id="tutorialScreen" class="tutorial-screen" hidden>
    <div class="tut-inner">
      <div class="tut-header">
        <div class="tut-progress-track"><div class="tut-progress-fill" id="tutProgressFill"></div></div>
        <div class="tut-header-row">
          <span class="tut-step-label" id="tutStepLabel">1 / 6</span>
          <div class="tut-header-nav">
            <button class="tut-home-btn" id="tutBackBtn" hidden>← 이전</button>
            <button class="tut-home-btn" id="tutSkipBtn" hidden>건너뛰기</button>
            <button class="tut-home-btn" id="tutHomeBtn">✕ 나가기</button>
          </div>
        </div>
      </div>
      <h2 class="tut-title" id="tutTitle"></h2>
      <div class="tut-context-bubble" id="tutContextBubble" hidden></div>
      <div class="tut-cards-wrapper">
        <div class="tut-card-area" id="tutCardArea"></div>
        <div class="tut-answer-log" id="tutAnswerLog" hidden>
          <div class="tut-log-title">📋 판단 결과</div>
        </div>
      </div>
      <div class="tut-bubble" id="tutBubble"></div>
      <div class="tut-feedback" id="tutFeedback"></div>
      <div class="tut-actions">
        <button class="tut-btn-hint" id="tutHintBtn" hidden>💡 힌트</button>
        <button class="tut-btn-next" id="tutNextBtn">다음 →</button>
      </div>
    </div>
  </div>

  <!-- 배경 파티클 -->
  <div class="bg-particles" id="bgParticles"></div>

  <!-- 헤더 -->
  <header class="game-header">
    <div class="header-inner">
      <div class="header-left">
        <button class="btn-theme" id="btnTheme" title="테마 전환">
          <span id="themeIcon">🌙</span>
          <span id="themeLabel">다크 모드</span>
        </button>
        <button class="btn-settings" id="btnSettings" title="단축키 설정">⚙ 설정</button>
      </div>
      <div class="header-center">
        <div class="stat-card" id="statTimer">
          <span class="stat-label" id="statTimerLabel">남은 시간</span>
          <span class="stat-value" id="timerDisplay">120</span>
          <span class="stat-unit" id="statTimerUnit">초</span>
        </div>
      </div>
      <div class="header-right">
        <div class="stat-card" id="statScore">
          <span class="stat-label">찾은 SET</span>
          <span class="stat-value" id="scoreDisplay">0</span>
          <span class="stat-unit">개</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 메인 게임 영역 -->
  <main class="game-main">
    <div class="hint-text" id="hintText"></div>
    <div class="card-grid" id="cardGrid"></div>
  </main>

  <!-- 선택 안내 바 -->
  <div class="selection-bar" id="selectionBar">
    <span id="selectionText">카드를 3장 선택하세요</span>
  </div>

  <!-- 하단 플로팅 액션 -->
  <div class="floating-menu" id="floatingMenu">
    <button class="btn-floating" id="btnFloatRestart" title="현재 모드 다시 시작">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
    </button>
    <button class="btn-floating" id="btnFloatHome" title="대문으로 (모드 선택)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </button>
  </div>

  <!-- 게임 오버 오버레이 -->
  <div class="overlay" id="gameOverlay" hidden>
    <div class="overlay-box">
      <div class="overlay-emoji" id="overlayEmoji">🎉</div>
      <h2 class="overlay-title" id="overlayTitle">시간 종료!</h2>
      <p class="overlay-desc" id="overlayDesc"></p>
      <button class="btn-restart" id="btnRestart">다시 시작</button>
    </div>
  </div>

  <!-- 단축키 설정 모달 -->
  <div class="settings-overlay" id="settingsOverlay" hidden>
    <div class="settings-box">
      <div class="settings-header">
        <h2 class="settings-title">⌨️ 설정</h2>
        <button class="settings-close" id="btnSettingsClose">✕</button>
      </div>
      
      <!-- 회전 설정 -->
      <div class="settings-section">
        <label class="settings-box-toggle">
          <input type="checkbox" id="chkRotate" />
          <span class="box-toggle-content">카드 이미지 90° 회전</span>
        </label>
      </div>

      <!-- 81장 정식 모드 배열 설정 -->
      <div class="settings-section" id="layoutSettingContainer">
        <label class="settings-box-toggle">
          <input type="checkbox" id="chkLayout" />
          <span class="box-toggle-content">3행 4열로 보기 (기본 4행 3열)</span>
        </label>
      </div>

      <!-- 단축키 설정 -->
      <div class="settings-section">
        <span class="settings-section-label">단축키</span>
        <p class="settings-desc">각 카드 위치를 클릭한 뒤 원하는 키를 누르세요.</p>
      </div>
      <div class="settings-grid" id="settingsGrid"></div>
      
      <!-- 프리셋 -->
      <div class="settings-actions">
        <button class="btn-preset" id="btnPreset1">프리셋 1 (123~)</button>
        <button class="btn-preset" id="btnPreset2">프리셋 2 (QWE~)</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/init.js"></script>
</body>
</html>
